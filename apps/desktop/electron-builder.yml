appId: com.company.aivideodesktop
productName: 兽药电商AI文案
electronVersion: 43.4.1
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: true
buildDependenciesFromSource: true
nativeRebuilder: sequential
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
  - '!**/node_modules/**/{test,tests,__tests__,example,examples}/**/*'
extraResources:
  - from: ../../migrations/desktop-sqlite
    to: migrations/desktop-sqlite
win:
  target:
    - nsis
  artifactName: '${productName}-${version}-${arch}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

name: Python supply-chain candidate generation

on:
  workflow_dispatch:
  push:
    branches: [code-c/stage-b-validation-candidate]

permissions:
  contents: read

concurrency:
  group: python-supply-chain-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-a-cpython-artifact-binding:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - run: pnpm install --frozen-lockfile
      - name: Download exact Windows CPython acquisition artifact
        run: >-
          python tools/code-c-python-supply-chain/download_toolchain_sources.py
          --target windows
          --output-root artifacts/python-supply-chain/toolchain
      - name: Reconfirm Stage A policy and exact CPython artifact binding
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const path="compliance/vulnerability-reviews/cpython-3.13.15-windows-x64/stage-a-current-context.json"; const value=JSON.parse(fs.readFileSync(path,"utf8")); value.source_commit=process.env.GITHUB_SHA; fs.mkdirSync("artifacts/python-supply-chain/evidence",{recursive:true}); fs.writeFileSync("artifacts/python-supply-chain/evidence/windows-stage-a-current-context.json",JSON.stringify(value,null,2)+"\n");'
          pnpm compliance:python:toolchain:vulnerability-disposition \
            --vulnerability-review compliance/vulnerability-reviews/cpython-3.13.15-windows-x64/stage-a-review.json \
            --current-context artifacts/python-supply-chain/evidence/windows-stage-a-current-context.json \
            --output artifacts/python-supply-chain/evidence/windows-stage-a-disposition.json
          python tools/code-c-python-supply-chain/verify_stage_a_cpython_artifact.py \
            --distribution artifacts/python-supply-chain/toolchain/windows/python-3.13.15-win32-x64.zip \
            --stage-a-review compliance/vulnerability-reviews/cpython-3.13.15-windows-x64/stage-a-review.json \
            --output artifacts/python-supply-chain/evidence/windows-stage-a-artifact-binding.json
      - name: Preserve Stage A binding evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-stage-a-cpython-binding-${{ github.sha }}
          path: artifacts/python-supply-chain/evidence
          if-no-files-found: error
          retention-days: 30

  generate-target-candidate:
    needs: stage-a-cpython-artifact-binding
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
            venv_python: artifacts/candidate-venv/bin/python
            worker: artifacts/python-supply-chain/pyinstaller-build/linux/dist/media-worker
            distribution: python-3.13.15-linux-24.04-x64.tar.gz
            pyinstaller_wheel: pyinstaller-6.22.2-py3-none-manylinux2014_x86_64.whl
          - target: windows
            runner: windows-2022
            venv_python: artifacts/candidate-venv/Scripts/python.exe
            worker: artifacts/python-supply-chain/pyinstaller-build/windows/dist/media-worker.exe
            distribution: python-3.13.15-win32-x64.zip
            pyinstaller_wheel: pyinstaller-6.22.2-py3-none-win_amd64.whl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Bootstrap only: this interpreter downloads/installs the locked distribution and is
          # only passed to the negative isolation regression after installation.
          python-version: '3.12.10'
      - name: Capture bootstrap Python identity for isolation regression
        id: bootstrap-python
        shell: bash
        run: |
          bootstrap_python="$(python -c 'import os, sys; print(os.path.abspath(sys.executable))')"
          echo "python=$bootstrap_python" >> "$GITHUB_OUTPUT"
          python --version
      - run: pnpm install --frozen-lockfile
      - run: >-
          python tools/code-c-python-supply-chain/download_toolchain_sources.py
          --target ${{ matrix.target }}
          --output-root artifacts/python-supply-chain/toolchain
      - name: Verify exact Stage A CPython artifact authorization
        if: matrix.target == 'windows'
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const path="compliance/vulnerability-reviews/cpython-3.13.15-windows-x64/stage-a-current-context.json"; const value=JSON.parse(fs.readFileSync(path,"utf8")); value.source_commit=process.env.GITHUB_SHA; fs.mkdirSync("artifacts/python-supply-chain/evidence",{recursive:true}); fs.writeFileSync("artifacts/python-supply-chain/evidence/windows-stage-a-current-context.json",JSON.stringify(value,null,2)+"\n");'
          pnpm compliance:python:toolchain:vulnerability-disposition \
            --vulnerability-review compliance/vulnerability-reviews/cpython-3.13.15-windows-x64/stage-a-review.json \
            --current-context artifacts/python-supply-chain/evidence/windows-stage-a-current-context.json \
            --output artifacts/python-supply-chain/evidence/windows-stage-a-disposition.json
          python tools/code-c-python-supply-chain/verify_stage_a_cpython_artifact.py \
            --distribution artifacts/python-supply-chain/toolchain/windows/${{ matrix.distribution }} \
            --stage-a-review compliance/vulnerability-reviews/cpython-3.13.15-windows-x64/stage-a-review.json \
            --output artifacts/python-supply-chain/evidence/windows-stage-a-artifact-binding.json
      - name: Install the exact locked CPython distribution
        id: locked-python
        shell: bash
        run: >-
          python tools/code-c-python-supply-chain/install_locked_cpython.py
          --target ${{ matrix.target }}
          --distribution artifacts/python-supply-chain/toolchain/${{ matrix.target }}/${{ matrix.distribution }}
          --pip-wheel artifacts/python-supply-chain/toolchain/${{ matrix.target }}/pip-26.2.1-py3-none-any.whl
          --output artifacts/python-supply-chain/evidence/${{ matrix.target }}-cpython-installation.json
      - name: Install hash-locked shared Python compliance tooling
        env:
          PYTHON_EXECUTABLE: ${{ steps.locked-python.outputs.python }}
        run: pnpm compliance:python:tooling:install
      - name: Capture real target tags from locked CPython
        env:
          PYTHON_EXECUTABLE: ${{ steps.locked-python.outputs.python }}
        run: >-
          pnpm compliance:python:target -- describe-current
          --output artifacts/python-supply-chain/target/${{ matrix.target }}.json
      - name: Reject ambient pip configuration
        shell: bash
        run: >-
          '${{ steps.locked-python.outputs.python }}' tools/code-c-python-supply-chain/bootstrap_pinned_pip.py
          --wheel artifacts/python-supply-chain/toolchain/${{ matrix.target }}/pip-26.2.1-py3-none-any.whl
          --venv artifacts/candidate-venv
      - name: Attest standard-GIL cp313 interpreter and runner target
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.locked-python.outputs.python }}
          PYTHONPATH: ${{ github.workspace }}/artifacts/python-compliance-tools/site-packages
          PYTHONNOUSERSITE: '1'
        run: >-
          ${{ matrix.venv_python }} tools/code-c-python-supply-chain/capture_runtime_identity.py
          --target ${{ matrix.target }}
          --target-descriptor artifacts/python-supply-chain/target/${{ matrix.target }}.json
          --distribution artifacts/python-supply-chain/toolchain/${{ matrix.target }}/${{ matrix.distribution }}
          --installation-evidence artifacts/python-supply-chain/evidence/${{ matrix.target }}-cpython-installation.json
          --output artifacts/python-supply-chain/evidence/${{ matrix.target }}-runtime-identity.json
      - name: Verify locked Python binding isolation and path handling
        shell: bash
        env:
          LOCKED_PYTHON_EXECUTABLE: ${{ steps.locked-python.outputs.python }}
          BOOTSTRAP_PYTHON_EXECUTABLE: ${{ steps.bootstrap-python.outputs.python }}
          CANDIDATE_PYTHON_EXECUTABLE: ${{ github.workspace }}/${{ matrix.venv_python }}
        run: |
          "$CANDIDATE_PYTHON_EXECUTABLE" tools/code-c-python-supply-chain/verify_interpreter_binding_regressions.py \
            --target "${{ matrix.target }}" \
            --target-descriptor "artifacts/python-supply-chain/target/${{ matrix.target }}.json" \
            --locked-python "$LOCKED_PYTHON_EXECUTABLE" \
            --bootstrap-python "$BOOTSTRAP_PYTHON_EXECUTABLE" \
            --output "artifacts/python-supply-chain/evidence/${{ matrix.target }}-interpreter-binding-regressions.json"
      - name: Generate target graph from wheel metadata
        shell: bash
        env:
          PIP_CONFIG_FILE: ${{ github.workspace }}/sidecars/media-worker/supply-chain/pip-hermetic.conf
          PYTHON_EXECUTABLE: ${{ steps.locked-python.outputs.python }}
          PYTHONNOUSERSITE: '1'
          PYTHONPATH: ${{ github.workspace }}/artifacts/python-compliance-tools/site-packages
        run: >-
          ${{ matrix.venv_python }} tools/code-c-python-supply-chain/generate_candidates.py
          --target ${{ matrix.target }}
          --target-descriptor artifacts/python-supply-chain/target/${{ matrix.target }}.json
          --runtime-identity artifacts/python-supply-chain/evidence/${{ matrix.target }}-runtime-identity.json
          --output-root artifacts/python-supply-chain
      - name: Verify fail-closed Python intake controls
        shell: bash
        env:
          PIP_CONFIG_FILE: ${{ github.workspace }}/sidecars/media-worker/supply-chain/pip-hermetic.conf
          PYTHONNOUSERSITE: '1'
        run: >-
          '${{ steps.locked-python.outputs.python }}' tools/code-c-python-supply-chain/verify_negative_controls.py
          --python ${{ matrix.venv_python }}
          --wheel artifacts/python-supply-chain/toolchain/${{ matrix.target }}/pip-26.2.1-py3-none-any.whl
      - name: Install candidate runtime and build graph with hashes
        shell: bash
        env:
          PIP_CONFIG_FILE: ${{ github.workspace }}/sidecars/media-worker/supply-chain/pip-hermetic.conf
          PYTHONNOUSERSITE: '1'
        run: >-
          python tools/code-c-python-supply-chain/install_candidate.py
          --python ${{ matrix.venv_python }}
          --candidate artifacts/python-supply-chain/candidates/code-c-${{ matrix.target }}-runtime.v2.json
          --wheel-root artifacts/python-supply-chain/wheels/runtime
          --candidate artifacts/python-supply-chain/candidates/code-c-${{ matrix.target }}-worker-build.v2.json
          --wheel-root artifacts/python-supply-chain/wheels/worker-build
      - name: Reconcile the installed candidate environment with the exact graph
        shell: bash
        run: >-
          ${{ matrix.venv_python }} -I tools/code-c-python-supply-chain/verify_candidate_installed.py
          --target ${{ matrix.target }}
          --bundle artifacts/python-supply-chain
          --scope runtime
          --scope worker-build
      - name: Run targeted CArchive symlink and native semantic regressions
        env:
          PYTHON_EXECUTABLE: ${{ github.workspace }}/${{ matrix.venv_python }}
        run: >-
          pnpm exec vitest run
          tests/contract/packaged-native-toolchain-provenance.test.ts
          -t 'uses CArchive typecode|fails closed for malformed CArchive symlink metadata'
          --maxWorkers=1
      - name: Run Worker and supply-chain contract regressions on the exact candidate graph
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ github.workspace }}/${{ matrix.venv_python }}
        run: |
          pnpm media-worker:test
          mkdir -p artifacts/python-supply-chain/evidence
          pnpm exec vitest run \
            tests/contract/python-supply-chain-tooling.test.ts \
            tests/contract/code-c-canonical-evidence.test.ts \
            tests/contract/packaged-native-toolchain-provenance.test.ts \
            tests/contract/packaging-selected-native-contract.test.ts \
            tests/contract/toolchain-vulnerability-disposition.test.ts \
            --maxWorkers=1 \
            --reporter=default \
            --reporter=json \
            --outputFile=artifacts/python-supply-chain/evidence/${{ matrix.target }}-current-head-regressions.json
          node -e 'const fs=require("node:fs"); const path="artifacts/python-supply-chain/evidence/${{ matrix.target }}-current-head-regressions.json"; const value=JSON.parse(fs.readFileSync(path,"utf8")); const files=value.testResults?.length; const tests=value.numTotalTests; if (!Number.isInteger(files)||files<=0||!Number.isInteger(tests)||tests<=0) throw new Error(`empty current-head regression execution: files=${files}, tests=${tests}`); console.log(`current-head-regression-evidence: PASS (shell=bash; files=${files}; tests=${tests}; assertions_executed=YES; exit_code=0)`);'
      - name: Freeze exact build context before PyInstaller starts
        shell: bash
        run: >-
          ${{ matrix.venv_python }} tools/code-c-python-supply-chain/prepare_pyinstaller_build_context.py
          --target ${{ matrix.target }}
          --workpath artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/work
          --distpath artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/dist
          --spec sidecars/media-worker/media-worker.spec
          --runtime-inventory artifacts/python-supply-chain/candidates/code-c-${{ matrix.target }}-runtime.v2.json
          --worker-build-inventory artifacts/python-supply-chain/candidates/code-c-${{ matrix.target }}-worker-build.v2.json
          --runtime-identity artifacts/python-supply-chain/evidence/${{ matrix.target }}-runtime-identity.json
          --distribution artifacts/python-supply-chain/toolchain/${{ matrix.target }}/${{ matrix.distribution }}
          --pip-wheel artifacts/python-supply-chain/toolchain/${{ matrix.target }}/pip-26.2.1-py3-none-any.whl
          --pyinstaller-wheel artifacts/python-supply-chain/toolchain/${{ matrix.target }}/${{ matrix.pyinstaller_wheel }}
          --main-quality-baseline d1348c50e36b725bfcbf9bec17343392cf0412c7
          --output artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/build-context.json
      - name: Build candidate one-file worker in clean isolated workpath
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/raw
          ${{ matrix.venv_python }} -I -m PyInstaller \
            --clean \
            --noconfirm \
            --workpath artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/work \
            --distpath artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/dist \
            sidecars/media-worker/media-worker.spec \
            2>&1 | tee artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/raw/pyinstaller-build.log
      - name: Capture raw PyInstaller Analysis, TOC and materialized evidence
        shell: bash
        run: >-
          ${{ matrix.venv_python }} tools/code-c-python-supply-chain/capture_pyinstaller_build_evidence.py
          --target ${{ matrix.target }}
          --workpath artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/work
          --distpath artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/dist
          --build-log artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/raw/pyinstaller-build.log
          --spec sidecars/media-worker/media-worker.spec
          --build-context artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/build-context.json
          --runtime-inventory artifacts/python-supply-chain/candidates/code-c-${{ matrix.target }}-runtime.v2.json
          --output-root artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}
      - name: Capture actual toolchain and CArchive evidence
        shell: bash
        env:
          PYTHONNOUSERSITE: '1'
        run: >-
          ${{ matrix.venv_python }} tools/code-c-python-supply-chain/capture_target_evidence.py
          --target ${{ matrix.target }}
          --bundle artifacts/python-supply-chain
          --distribution artifacts/python-supply-chain/toolchain/${{ matrix.target }}/${{ matrix.distribution }}
          --pip-wheel artifacts/python-supply-chain/toolchain/${{ matrix.target }}/pip-26.2.1-py3-none-any.whl
          --pyinstaller-wheel artifacts/python-supply-chain/toolchain/${{ matrix.target }}/${{ matrix.pyinstaller_wheel }}
          --build-context artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/build-context.json
          --build-evidence artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/pyinstaller-build-evidence.json
          --final-artifact ${{ matrix.worker }}
      - name: Validate Packaging Selection Evidence v1 and Native Reconciliation v3
        shell: bash
        run: |
          node tools/python-supply-chain/cli.mjs packaging-selection-validate \
            --selection-evidence artifacts/python-supply-chain/native-v3/${{ matrix.target }}/packaging-selection-evidence.v1.json
          node tools/python-supply-chain/cli.mjs native-reconcile-v3 \
            --selection-evidence artifacts/python-supply-chain/native-v3/${{ matrix.target }}/packaging-selection-evidence.v1.json \
            --native-reconciliation artifacts/python-supply-chain/native-v3/${{ matrix.target }}/native-reconciliation.v3.json \
            --output artifacts/python-supply-chain/native-v3/${{ matrix.target }}/native-reconciliation-report.v3.json
      - name: Freeze approved exact wheel graph
        shell: bash
        run: |
          reviewed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ${{ matrix.venv_python }} tools/code-c-python-supply-chain/approve_candidates.py \
            --target ${{ matrix.target }} \
            --bundle artifacts/python-supply-chain \
            --artifact-root artifacts/python-supply-chain/approved-wheels \
            --inventory-root artifacts/python-supply-chain/approved-inventories \
            --lock-root artifacts/python-supply-chain/hash-locks \
            --reviewed-at "$reviewed_at"
      - name: Capture exact target graph and Artifact License Evidence v3
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ github.workspace }}/${{ matrix.venv_python }}
        run: >-
          node tools/code-c-python-supply-chain/prepare_license_target.mjs
          --target ${{ matrix.target }}
          --inventory-root artifacts/python-supply-chain/approved-inventories/${{ matrix.target }}
          --artifact-root artifacts/python-supply-chain/approved-wheels
          --resolution-root artifacts/python-supply-chain/resolution
          --build-context artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/build-context.json
          --output-root artifacts/python-supply-chain/license-preparation/${{ matrix.target }}
          --main-quality-baseline d1348c50e36b725bfcbf9bec17343392cf0412c7
      - name: Preserve candidate worker bytes
        shell: bash
        run: |
          mkdir -p artifacts/python-supply-chain/build/${{ matrix.target }}
          cp '${{ matrix.worker }}' artifacts/python-supply-chain/build/${{ matrix.target }}/
      - name: Preserve target license preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-license-preparation-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/python-supply-chain/license-preparation
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve compact native reconciliation diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-native-diagnostic-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ matrix.worker }}
            artifacts/python-supply-chain/candidates/code-c-${{ matrix.target }}-runtime.v2.json
            artifacts/python-supply-chain/candidates/code-c-${{ matrix.target }}-worker-build.v2.json
            artifacts/python-supply-chain/diagnostics/${{ matrix.target }}-native-reconciliation.json
            artifacts/python-supply-chain/evidence/${{ matrix.target }}-cpython-installation.json
            artifacts/python-supply-chain/evidence/${{ matrix.target }}-runtime-identity.json
            artifacts/python-supply-chain/evidence/${{ matrix.target }}-target-evidence.json
            artifacts/python-supply-chain/inspection/${{ matrix.target }}-worker-onefile.json
            artifacts/python-supply-chain/native-v3/${{ matrix.target }}
            artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/build-context.json
            artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/pyinstaller-build-evidence.json
            artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/parsed
            artifacts/python-supply-chain/pyinstaller-build/${{ matrix.target }}/raw
            artifacts/python-supply-chain/target/${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-supply-chain-candidate-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/python-supply-chain
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  assemble-license-review-bundle:
    needs: generate-target-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Linux and Windows exact-license target evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-license-preparation-*-${{ github.sha }}
          path: artifacts/python-supply-chain/license-preparation
          merge-multiple: true
      - name: Build graph-bound exact-artifact review request bundle
        run: >-
          node tools/code-c-python-supply-chain/create_license_review_bundle.mjs
          --input-root artifacts/python-supply-chain/license-preparation
          --output-root artifacts/python-supply-chain/license-review-bundle
      - name: Preserve formal license review handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-c-artifact-license-review-bundle-${{ github.sha }}
          path: artifacts/python-supply-chain/license-review-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  report-license-preparation-status:
    if: always()
    needs: [generate-target-candidate, assemble-license-review-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      statuses: write
    steps:
      - name: Download completed license preparation summary
        if: needs.assemble-license-review-bundle.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-c-artifact-license-review-bundle-${{ github.sha }}
          path: artifacts/python-supply-chain/license-review-bundle
      - name: Publish exact candidate preparation status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_JOBS_RESULT: ${{ needs.generate-target-candidate.result }}
          BUNDLE_JOB_RESULT: ${{ needs.assemble-license-review-bundle.result }}
        shell: bash
        run: |
          state=failure
          description="candidate preparation failed before exact-artifact bundle"
          summary=artifacts/python-supply-chain/license-review-bundle/CODE_C_LICENSE_REVIEW_PREPARATION.json
          if [[ "$TARGET_JOBS_RESULT" == success && "$BUNDLE_JOB_RESULT" == success && -f "$summary" ]]; then
            state=success
            description="$(jq -r '"bundle ready; gate=" + .python_license_gate + "; total=" + (.total_unique_wheel_artifacts|tostring) + ", review=" + (.required_review|tostring) + ", blocked=" + (.hard_blocked|tostring)' "$summary")"
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context 'code-c/artifact-license-review-preparation' \
            --arg description "$description" \
            --arg target_url "$TARGET_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/$TARGET_REPOSITORY/statuses/$TARGET_SHA" \
            --data "$payload"

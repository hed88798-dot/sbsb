name: Code F FFmpeg Render Runtime Intake

on:
  push:
    branches:
      - code-f/ffmpeg-render-runtime-intake
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-f-ffmpeg-render-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_SOURCE_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
  FFMPEG_RELEASE_COMMIT: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
  FFMPEG_RENDER_BUILD_PROFILE_SHA256: c52da34133a074c2f1234c36679376e4ead6fdce6eb452ec4b7df2c3601f2393
  CODE_G_CAPABILITY_PROFILE_COMMIT: 9cc2326bf5059290f1a8498d0683e7e7d6f3bf9d
  CODE_G_CAPABILITY_PROFILE_HASH: e05686e544bd31de1782b4b13cb23e993e6c26ef90408b1d19b8e59dd5ac5910

jobs:
  windows:
    name: Windows x86_64 FFmpeg Render Runtime
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install pinned repository tooling
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Code G profile and Render Build Profile
        shell: pwsh
        run: pnpm compliance:ffmpeg:profile:verify
      - name: Verify exact MSYS2 toolchain
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $cygpath = 'C:\msys64\usr\bin\cygpath.exe'
          if (!(Test-Path $bash) -or !(Test-Path $cygpath)) { throw 'MSYS2 UCRT64 toolchain is unavailable on the target runner' }
          $workspace = (& $cygpath -u $env:GITHUB_WORKSPACE).Trim()
          $runnerTemp = (& $cygpath -u $env:RUNNER_TEMP).Trim()
          $nodePath = (Get-Command node).Source
          $nodeBin = (& $cygpath -u (Split-Path -Parent $nodePath)).Trim()
          if ([string]::IsNullOrWhiteSpace($workspace) -or [string]::IsNullOrWhiteSpace($nodeBin)) { throw 'Runner path binding failed' }
          $command = "cd '$workspace' && export GITHUB_WORKSPACE='$workspace' RUNNER_TEMP='$runnerTemp' MSYSTEM=UCRT64 NODE_BIN='$nodeBin' MAKE_COMMAND=mingw32-make PATH='/ucrt64/bin:/usr/bin:/bin:$nodeBin' && ./tools/ffmpeg-render-build/preflight-windows.sh"
          & $bash --noprofile --norc -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify exact Windows Render runtime
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $cygpath = 'C:\msys64\usr\bin\cygpath.exe'
          $workspace = (& $cygpath -u $env:GITHUB_WORKSPACE).Trim()
          $runnerTemp = (& $cygpath -u $env:RUNNER_TEMP).Trim()
          $nodePath = (Get-Command node).Source
          $nodeBin = (& $cygpath -u (Split-Path -Parent $nodePath)).Trim()
          $command = "cd '$workspace' && export GITHUB_WORKSPACE='$workspace' RUNNER_TEMP='$runnerTemp' MSYSTEM=UCRT64 NODE_BIN='$nodeBin' MAKE_COMMAND=mingw32-make PATH='/ucrt64/bin:/usr/bin:/bin:$nodeBin' GITHUB_SHA='$env:GITHUB_SHA' GITHUB_RUN_ID='$env:GITHUB_RUN_ID' && ./tools/ffmpeg-render-build/build-windows.sh"
          & $bash --noprofile --norc -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package immutable transient transport
        if: always()
        shell: bash
        run: |
          if [[ -d artifacts/ffmpeg-render/windows ]]; then
            mkdir -p artifacts/ffmpeg-render/windows-transport
            tar --format=posix -cf artifacts/ffmpeg-render/windows-transport/ffmpeg-render-windows.tar -C artifacts/ffmpeg-render/windows .
            sha256sum artifacts/ffmpeg-render/windows-transport/ffmpeg-render-windows.tar > artifacts/ffmpeg-render/windows-transport/ffmpeg-render-windows.tar.sha256
          fi
      - name: Upload transient Windows candidate transport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-render-windows-${{ github.sha }}
          path: artifacts/ffmpeg-render/windows-transport
          if-no-files-found: error
          retention-days: 1

name: Code F FFmpeg Render Runtime Intake

on:
  push:
    branches:
      - code-f/ffmpeg-render-runtime-intake
    paths:
      - '.github/workflows/code-f-ffmpeg-render-runtime.yml'
      - 'compliance/runtime-dependency-intake/ffmpeg-render-v1/**'
      - 'docs/render/ffmpeg-required-capability-profile.v1.json'
      - 'tools/ffmpeg-render-build/**'
      - 'tools/ffmpeg-render-build-profile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/code-f-ffmpeg-render-runtime.yml'
      - 'compliance/runtime-dependency-intake/ffmpeg-render-v1/**'
      - 'docs/render/ffmpeg-required-capability-profile.v1.json'
      - 'tools/ffmpeg-render-build/**'
      - 'tools/ffmpeg-render-build-profile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-f-ffmpeg-render-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_SOURCE_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
  FFMPEG_RELEASE_COMMIT: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
  FFMPEG_RENDER_BUILD_PROFILE_SHA256: 8a8c032009beb90f57ba6a48f6bdb8d01ddf67b2c372c16795e1729c016e57ff
  CODE_G_CAPABILITY_PROFILE_COMMIT: 3a212342b573d0f785c0bb9be91cb8a8bad0a113
  CODE_G_CAPABILITY_PROFILE_HASH: e05686e544bd31de1782b4b13cb23e993e6c26ef90408b1d19b8e59dd5ac5910

jobs:
  windows:
    name: Windows x86_64 FFmpeg Render Runtime
    runs-on: windows-2022
    timeout-minutes: 180
    # windows-2022 is a Windows Server image. It is authoritative for source
    # build, static inventory, provenance, manifest, closure, and compliance
    # evidence only. Desktop-only h264_mf execution is supplied by the
    # separately retained Windows 11 Desktop evidence.
    env:
      FFMPEG_CAPABILITY_MODE: STATIC_SERVER
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact evidence bytes on Windows checkout
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git reset --hard HEAD
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install pinned repository tooling
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Code G profile and Render Build Profile
        shell: pwsh
        run: pnpm compliance:ffmpeg:profile:verify
      - name: Verify exact MSYS2 toolchain
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $cygpath = 'C:\msys64\usr\bin\cygpath.exe'
          if (!(Test-Path $bash) -or !(Test-Path $cygpath)) { throw 'MSYS2 UCRT64 toolchain is unavailable on the target runner' }
          $workspace = (& $cygpath -u $env:GITHUB_WORKSPACE).Trim()
          $runnerTemp = (& $cygpath -u $env:RUNNER_TEMP).Trim()
          $nodePath = (Get-Command node).Source
          $nodeBin = (& $cygpath -u (Split-Path -Parent $nodePath)).Trim()
          if ([string]::IsNullOrWhiteSpace($workspace) -or [string]::IsNullOrWhiteSpace($nodeBin)) { throw 'Runner path binding failed' }
          $command = "cd '$workspace' && export GITHUB_WORKSPACE='$workspace' RUNNER_TEMP='$runnerTemp' MSYSTEM=UCRT64 NODE_BIN='$nodeBin' MAKE_COMMAND=mingw32-make PATH='/ucrt64/bin:/usr/bin:/bin:$nodeBin' && ./tools/ffmpeg-render-build/preflight-windows.sh"
          & $bash --noprofile --norc -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify exact Windows Render runtime
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $cygpath = 'C:\msys64\usr\bin\cygpath.exe'
          $workspace = (& $cygpath -u $env:GITHUB_WORKSPACE).Trim()
          $runnerTemp = (& $cygpath -u $env:RUNNER_TEMP).Trim()
          $nodePath = (Get-Command node).Source
          $nodeBin = (& $cygpath -u (Split-Path -Parent $nodePath)).Trim()
          $gitPath = (Get-Command git).Source
          $command = "cd '$workspace' && export GITHUB_WORKSPACE='$workspace' RUNNER_TEMP='$runnerTemp' MSYSTEM=UCRT64 NODE_BIN='$nodeBin' GIT_PATH='$gitPath' MAKE_COMMAND=mingw32-make FFMPEG_CAPABILITY_MODE='$env:FFMPEG_CAPABILITY_MODE' PATH='/ucrt64/bin:/usr/bin:/bin:$nodeBin' GITHUB_SHA='$env:GITHUB_SHA' GITHUB_RUN_ID='$env:GITHUB_RUN_ID' && ./tools/ffmpeg-render-build/build-windows.sh"
          & $bash --noprofile --norc -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package immutable transient transport
        if: always()
        shell: bash
        run: |
          if [[ -d artifacts/ffmpeg-render/windows ]]; then
            mkdir -p artifacts/ffmpeg-render/windows-transport
            tar --format=posix -cf artifacts/ffmpeg-render/windows-transport/ffmpeg-render-windows.tar -C artifacts/ffmpeg-render/windows .
            sha256sum artifacts/ffmpeg-render/windows-transport/ffmpeg-render-windows.tar > artifacts/ffmpeg-render/windows-transport/ffmpeg-render-windows.tar.sha256
          fi
      - name: Upload transient Windows candidate transport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-render-windows-${{ github.sha }}
          path: artifacts/ffmpeg-render/windows-transport
          if-no-files-found: error
          retention-days: 1

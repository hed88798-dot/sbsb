name: Code F FFmpeg Rotation Pixel Oracle v2

on:
  workflow_dispatch:
    inputs:
      fixture_url:
        description: Exact authorized H.264 MP4 fixture URL for the RGB24 smoke
        required: true
        type: string
      fixture_sha256:
        description: SHA-256 of the exact H.264 MP4 fixture
        required: true
        type: string
      fixture_width:
        description: Fixture video width in pixels
        required: true
        type: string
      fixture_height:
        description: Fixture video height in pixels
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: code-f-ffmpeg-pixel-oracle-v2
  cancel-in-progress: false

jobs:
  build-windows-x86_64:
    name: Build and freeze TEST_ONLY pixel oracle v2 (Windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PIXEL_ORACLE_OUT: artifacts/ffmpeg-pixel-oracle-v2/windows
      FIXTURE_URL: ${{ inputs.fixture_url }}
      FIXTURE_SHA256: ${{ inputs.fixture_sha256 }}
      FIXTURE_WIDTH: ${{ inputs.fixture_width }}
      FIXTURE_HEIGHT: ${{ inputs.fixture_height }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906952 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve exact checkout bytes
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git checkout-index --all --force

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Capture exact source head and tree
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "checkout does not match GITHUB_SHA: $head != $env:GITHUB_SHA" }
          $tree = (git rev-parse "$head^{tree}").Trim()
          "FFMPEG_SOURCE_TREE_SHA=$tree" >> $env:GITHUB_ENV

      - name: Download and verify exact H.264 smoke fixture
        shell: pwsh
        run: |
          $expectedFixtureUrl = 'https://api.github.com/repos/hed88798-dot/sbsb/releases/assets/561006627'
          if ($env:FIXTURE_URL -ne $expectedFixtureUrl) { throw "fixture URL must bind authorized asset 561006627: $($env:FIXTURE_URL)" }
          if ($env:FIXTURE_URL -notmatch '^https://api\.github\.com/repos/hed88798-dot/sbsb/releases/assets/[0-9]+$') { throw 'fixture URL must use the GitHub release-asset API endpoint' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'GitHub token is required for private/draft release asset retrieval' }
          $fixture = Join-Path $env:RUNNER_TEMP 'pixel-oracle-v2-fixture.mp4'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
          }
          Invoke-WebRequest -Uri $env:FIXTURE_URL -Headers $headers -OutFile $fixture
          $actual = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FIXTURE_SHA256.ToLowerInvariant()) { throw "fixture hash mismatch: $actual != $($env:FIXTURE_SHA256)" }
          "PIXEL_ORACLE_SMOKE_FIXTURE=$fixture" >> $env:GITHUB_ENV

      - name: Verify exact MSYS2 build toolchain
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $cygpath = 'C:\msys64\usr\bin\cygpath.exe'
          if (!(Test-Path $bash) -or !(Test-Path $cygpath)) { throw 'MSYS2 UCRT64 toolchain is unavailable' }
          $workspace = (& $cygpath -u $env:GITHUB_WORKSPACE).Trim()
          $runnerTemp = (& $cygpath -u $env:RUNNER_TEMP).Trim()
          $nodeBin = (& $cygpath -u (Split-Path -Parent (Get-Command node).Source)).Trim()
          $command = "cd '$workspace' && export GITHUB_WORKSPACE='$workspace' RUNNER_TEMP='$runnerTemp' MSYSTEM=UCRT64 NODE_BIN='$nodeBin' MAKE_COMMAND=mingw32-make PATH='/ucrt64/bin:/usr/bin:/bin:$nodeBin' && ./tools/ffmpeg-render-build/preflight-windows.sh"
          & $bash --noprofile --norc -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and statically verify TEST_ONLY pixel oracle v2
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $cygpath = 'C:\msys64\usr\bin\cygpath.exe'
          $workspace = (& $cygpath -u $env:GITHUB_WORKSPACE).Trim()
          $runnerTemp = (& $cygpath -u $env:RUNNER_TEMP).Trim()
          $fixture = (& $cygpath -u $env:PIXEL_ORACLE_SMOKE_FIXTURE).Trim()
          $nodeBin = (& $cygpath -u (Split-Path -Parent (Get-Command node).Source)).Trim()
          $command = "cd '$workspace' && export GITHUB_WORKSPACE='$workspace' RUNNER_TEMP='$runnerTemp' MSYSTEM=UCRT64 NODE_BIN='$nodeBin' MAKE_COMMAND=mingw32-make FFMPEG_SOURCE_TREE_SHA='$env:FFMPEG_SOURCE_TREE_SHA' PIXEL_ORACLE_OUT='artifacts/ffmpeg-pixel-oracle-v2/windows' PIXEL_ORACLE_SMOKE_FIXTURE='$fixture' PIXEL_ORACLE_SMOKE_FIXTURE_SHA256='$env:FIXTURE_SHA256' PIXEL_ORACLE_SMOKE_WIDTH='$env:FIXTURE_WIDTH' PIXEL_ORACLE_SMOKE_HEIGHT='$env:FIXTURE_HEIGHT' PATH='/ucrt64/bin:/usr/bin:/bin:$nodeBin' && ./tools/ffmpeg-render-pixel-oracle-v2/build-windows.sh"
          & $bash --noprofile --norc -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload TEST_ONLY v2 transport artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-f-rotation-pixel-oracle-v2-windows-x86_64-${{ github.sha }}
          path: |
            artifacts/ffmpeg-pixel-oracle-v2/windows/code-f-rotation-pixel-oracle-v2-windows-x86_64.tar
            artifacts/ffmpeg-pixel-oracle-v2/windows/code-f-rotation-pixel-oracle-v2-windows-x86_64.tar.sha256
          if-no-files-found: error
          retention-days: 1

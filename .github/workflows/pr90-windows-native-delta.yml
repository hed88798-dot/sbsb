name: PR90 Windows dual ABI delta

on:
  pull_request:
    paths:
      - .github/workflows/pr90-windows-native-delta.yml
      - tools/demo-deploy/**

permissions:
  contents: read

jobs:
  dual-abi:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - name: Export and execute Node native binding
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/pr90-native/node24,artifacts/pr90-native/electron43 | Out-Null
          $root = node -p "require('path').dirname(require.resolve('better-sqlite3/package.json'))"
          if ($LASTEXITCODE -ne 0) { throw 'BINDING_ROOT_MISSING' }
          Copy-Item (Join-Path $root 'build/Release/better_sqlite3.node') artifacts/pr90-native/node24/better_sqlite3.node
          node tools/demo-deploy/sqlite-probe.mjs node artifacts/pr90-native/node24/better_sqlite3.node artifacts/pr90-native/node24/smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'NODE_NATIVE_EXECUTION_FAILED' }
      - run: pnpm ci:prepare
      - run: pnpm native:rebuild
      - run: pnpm package:dir
      - run: $env:REQUIRE_PACKAGED_SMOKE='1'; pnpm exec vitest run tests/integration/native-addon-packaging.test.ts --maxWorkers=1
      - name: Export and execute packaged Electron native binding
        shell: pwsh
        run: |
          $release = 'apps/desktop/release/win-unpacked'
          $bindings = @(Get-ChildItem "$release/resources/app.asar.unpacked" -Recurse -Filter better_sqlite3.node)
          if ($bindings.Count -ne 1) { throw 'PACKAGED_BINDING_COUNT_INVALID' }
          Copy-Item $bindings[0].FullName artifacts/pr90-native/electron43/better_sqlite3.node
          $electron = @(Get-ChildItem $release -File -Filter '*.exe')
          if ($electron.Count -ne 1) { throw 'PACKAGED_EXECUTABLE_COUNT_INVALID' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            & $electron[0].FullName tools/demo-deploy/sqlite-probe.mjs electron artifacts/pr90-native/electron43/better_sqlite3.node artifacts/pr90-native/electron43/smoke.json
            if ($LASTEXITCODE -ne 0) { throw 'ELECTRON_NATIVE_EXECUTION_FAILED' }
          } finally { Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue }
          $node = Get-Content artifacts/pr90-native/node24/smoke.json -Raw | ConvertFrom-Json
          $app = Get-Content artifacts/pr90-native/electron43/smoke.json -Raw | ConvertFrom-Json
          if ($node.modules_abi -eq $app.modules_abi) { throw 'DUAL_ABI_EXPECTATION_INVALID' }
          @{base_head='f804291a286ddbe49840b623ae738e4fd98ab1dc'; build_head='${{ github.event.pull_request.head.sha }}'; run_id='${{ github.run_id }}'; paid_provider_requests=0; packaged_main_sqlite_smoke='PASS'} | ConvertTo-Json | Set-Content artifacts/pr90-native/build.json -Encoding utf8
      - name: Enforce transient native artifact budget
        run: >-
          node tools/actions-artifact-budget.mjs
          --name pr90-windows-dual-abi-${{ github.event.pull_request.head.sha }}
          --path artifacts/pr90-native
          --inventory artifacts/pr90-native/UPLOAD_INVENTORY.json
          --retention-days 1
          --purpose pr90-native-deployment-delta
          --classification transient
          --max-bytes 52428800
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr90-windows-dual-abi-${{ github.event.pull_request.head.sha }}
          path: artifacts/pr90-native
          if-no-files-found: error
          retention-days: 1

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - run: pnpm install --frozen-lockfile
      - run: pnpm compliance:python:tooling:install
      - run: pnpm compliance:python:target -- describe-current --output artifacts/compliance/CURRENT_TARGET.json
      - run: pnpm compliance:python:target -- verify-current --target artifacts/compliance/CURRENT_TARGET.json
      - run: pnpm ci:prepare
      - run: pnpm package:resolution
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm ci:typecheck
      - run: pnpm ci:test
      - run: pnpm dependency:check
      - run: pnpm portability:check
      - run: pnpm workflow:security
      - run: pnpm secret:scan
      - run: pnpm license:scan -- --report artifacts/compliance/LICENSE_FIRST_PASS.json
      - run: pnpm vulnerability:scan
      - run: pnpm compliance:python:verify
      - run: pnpm compliance:python:target:verify
      - run: pnpm golden:verify
      - run: pnpm build
      - run: pnpm sbom:generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-compliance-${{ github.sha }}
          path: artifacts/compliance
          if-no-files-found: error
          retention-days: 30

  isolated-clean-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - run: pnpm clean-checkout

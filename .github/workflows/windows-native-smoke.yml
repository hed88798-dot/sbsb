name: Windows native smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-native-addon:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --requirement sidecars/media-worker/requirements-ci.lock
      - run: pnpm ci:prepare
      - run: pnpm package:resolution
      - run: pnpm portability:check
      - run: pnpm workflow:security
      - run: pnpm secret:scan
      - run: pnpm license:scan
      - run: pnpm golden:verify
      - run: pnpm exec vitest run tests/contract/mock-sidecar.test.ts --maxWorkers=1
      - run: pnpm media-worker:test
      - run: pnpm native:rebuild
      - run: pnpm package:dir
      - run: $env:REQUIRE_PACKAGED_SMOKE='1'; pnpm exec vitest run tests/integration/native-addon-packaging.test.ts --maxWorkers=1
